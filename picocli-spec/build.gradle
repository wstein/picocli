plugins {
    id 'java'
}

group = 'info.picocli'
description = 'Picocli Spec - Build picocli CommandSpec models from a lightweight DSL or JSON, export any CommandSpec to JSON, and merge externally-defined command specs into a host CLI.'
version = "$projectVersion"
ext.moduleName = 'info.picocli.spec'

java {
    if (!JavaVersion.current().isJava9Compatible()) {
        sourceCompatibility = JavaVersion.VERSION_1_6
        targetCompatibility = JavaVersion.VERSION_1_6
    } else { // from Java 9 and up
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }
}

dependencies {
    api rootProject
}

test {
    // Flix0600ExampleTest reads examples/*.picocli by a path relative to this module's directory
    // (Gradle's default test working directory) rather than as a classpath resource, so
    // Gradle's up-to-date check wouldn't otherwise notice when that file changes.
    inputs.dir('examples')
}

jar {
    manifest {
        attributes 'Specification-Title'   : 'Picocli Spec',
                   'Specification-Vendor'  : 'Remko Popma',
                   'Specification-Version' : archiveVersion.get(),
                   'Implementation-Title'  : 'Picocli Spec',
                   'Implementation-Vendor' : 'Remko Popma',
                   'Implementation-Version': archiveVersion.get()
    }
}

ext {
    PUBLISH_GROUP_ID = group
    PUBLISH_ARTIFACT_ID = project.name
    PUBLISH_VERSION = "$projectVersion"
}
apply from: "${rootProject.projectDir}/gradle/publish-mavencentral.gradle"
