name: Release
on:
  push:
    tags: [ 'v*.*.*' ]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g. 1.2.3, without a leading "v")'
        required: true

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@c6295a65d1254861815972266d5933fd6e532bdf
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Determine version and tag
        id: vars
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
            TAG="v${VERSION}"
          else
            TAG="${GITHUB_REF_NAME}"
            VERSION="${TAG#v}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Create and push tag
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "${{ steps.vars.outputs.tag }}"
          git push origin "${{ steps.vars.outputs.tag }}"

      - name: Validate Gradle Wrapper
        uses: gradle/wrapper-validation-action@f9c9c575b8b21b6485636a91ffecd10e558c62f6

      - name: Configure JDK
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00
        with:
          distribution: 'zulu'
          java-version: 17
          cache: gradle

      - name: Set release version
        run: |
          sed -i "s/projectVersion *= *\"[^\"]*\"/projectVersion = \"${{ steps.vars.outputs.version }}\"/" dependencies.gradle
          grep projectVersion dependencies.gradle

      - name: Build
        run: ./gradlew --stop; ./gradlew clean build --no-daemon

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.vars.outputs.tag }}" \
            build/libs/*.jar \
            --title "picocli ${{ steps.vars.outputs.version }}" \
            --generate-notes

      - name: Check out existing flat Maven repo (gh-pages)
        run: |
          git fetch origin gh-pages || true
          if git show-ref --verify --quiet refs/remotes/origin/gh-pages; then
            git worktree add gh-pages-site origin/gh-pages
          else
            git worktree add --detach gh-pages-site HEAD
            git -C gh-pages-site checkout --orphan gh-pages
            git -C gh-pages-site rm -rf . > /dev/null
          fi
          mkdir -p build/fork-maven-repo
          if [ -d gh-pages-site/maven ]; then
            cp -r gh-pages-site/maven/. build/fork-maven-repo/
          fi

      - name: Publish to flat Maven repo (jar + pom only, io.github.wstein:picocli)
        run: ./gradlew publishForkPublicationToForkRepoRepository --no-daemon

      - name: Generate javadoc
        run: ./gradlew :javadoc :picocli-jsonspec:javadoc --no-daemon

      - name: Push updated site to GitHub Pages
        run: |
          rm -rf gh-pages-site/maven
          mkdir -p gh-pages-site/maven
          cp -r build/fork-maven-repo/. gh-pages-site/maven/

          rm -rf gh-pages-site/apidocs
          mkdir -p gh-pages-site/apidocs/picocli gh-pages-site/apidocs/picocli-jsonspec
          cp -r build/docs/apidocs/. gh-pages-site/apidocs/picocli/
          cp -r picocli-jsonspec/build/docs/apidocs/. gh-pages-site/apidocs/picocli-jsonspec/

          # jsonspec/schema is NOT wiped: unlike apidocs (always "latest" only), every version's
          # schema is kept permanently, mirroring how maven/ accumulates every released jar.
          SCHEMA_SRC=picocli-jsonspec/src/main/resources/picocli/jsonspec/command-spec.schema.json
          LATEST_URL="https://wstein.github.io/picocli/jsonspec/schema/command-spec.schema.json"
          VERSIONED_URL="https://wstein.github.io/picocli/jsonspec/schema/${{ steps.vars.outputs.version }}/command-spec.schema.json"
          mkdir -p "gh-pages-site/jsonspec/schema/${{ steps.vars.outputs.version }}"
          cp "$SCHEMA_SRC" gh-pages-site/jsonspec/schema/command-spec.schema.json
          sed "s#$LATEST_URL#$VERSIONED_URL#" "$SCHEMA_SRC" > "gh-pages-site/jsonspec/schema/${{ steps.vars.outputs.version }}/command-spec.schema.json"

          cp gh-pages/index.html gh-pages-site/index.html

          cd gh-pages-site
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add maven apidocs jsonspec index.html
          git commit -m "Publish io.github.wstein:picocli:${{ steps.vars.outputs.version }} (maven, javadoc, jsonspec schema, site)" || echo "Nothing to commit"
          git push origin HEAD:gh-pages
